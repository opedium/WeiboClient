<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 — Weibo App</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f2f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,.10);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 360px;
    }
    h1 { font-size: 1.4rem; font-weight: 600; margin-bottom: 1.75rem; color: #1a1a1a; text-align: center; }
    label { display: block; font-size: .875rem; color: #555; margin-bottom: .35rem; }
    input {
      width: 100%;
      padding: .625rem .75rem;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color .15s;
      margin-bottom: 1.1rem;
    }
    input:focus { border-color: #e6162d; }
    button {
      width: 100%;
      padding: .7rem;
      background: #e6162d;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
    }
    button:hover { background: #c0121f; }
    button:disabled { background: #f5a0a9; cursor: not-allowed; }
    .error {
      margin-top: .9rem;
      padding: .6rem .75rem;
      background: #fff0f0;
      border: 1px solid #fca5a5;
      border-radius: 8px;
      color: #b91c1c;
      font-size: .875rem;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Weibo App</h1>
    <form id="form">
      <label for="username">用户名</label>
      <input id="username" type="text" autocomplete="username" required autofocus />
      <label for="password">密码</label>
      <input id="password" type="password" autocomplete="current-password" required />
      <button type="submit" id="btn">登录</button>
      <div class="error" id="err"></div>
    </form>
  </div>
  <script>
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn');
      const err = document.getElementById('err');
      err.style.display = 'none';
      btn.disabled = true;
      btn.textContent = '登录中…';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json();
        if (data.ok) {
          location.reload();
        } else {
          err.textContent = data.error || '登录失败';
          err.style.display = 'block';
        }
      } catch {
        err.textContent = '网络错误，请重试';
        err.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = '登录';
      }
    });
  </script>
</body>
</html>
